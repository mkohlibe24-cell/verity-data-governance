[project]
name = "verity-data-governance"
version = "0.1.0"
description = "Data quality, governance and transaction monitoring platform (portfolio project)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "data", "warehouse"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Lint, test and run the pipeline on the sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check pipeline tests api

      - name: Unit tests (pytest)
        run: pytest

      - name: End-to-end pipeline on the committed CC0 sample
        run: python pipeline/run_pipeline.py --sample

      - name: Upload sample-run results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sample-run
          path: |
            reports/results_sample.json
            logs/

  web:
    name: Type-check and build the web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc) and build (Vite)
        run: npm run build
